# Scrape job — sole multi-workspace writer for Cluster Monitor.
#
# Uses serverless Python so Lakebase is reachable on IP-ACL workspaces (classic
# cluster egress is often blocked). For Private Link customer hubs where classic
# VNet is required for spoke APIs *and* Lakebase is reachable from that VNet,
# replace environment_key with a classic job_cluster (Standard_DS3_v2).
resources:
  jobs:
    cluster_monitor_snapshot:
      name: cluster-monitor-snapshot
      description: >
        Scraper: lists clusters, warehouses, pipelines, and job runs across
        configured workspaces and writes Lakebase snapshots for the read-only App.

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      environments:
        - environment_key: scrape_env
          spec:
            client: "2"
            dependencies:
              - psycopg[binary]>=3.0
              - databricks-sdk>=0.81.0
              - cryptography>=42.0.0

      tasks:
        - task_key: snapshot
          environment_key: scrape_env
          spark_python_task:
            python_file: ../snapshot_job.py
            parameters:
              - "--lakebase-endpoint=projects/cmon-${bundle.target}/branches/production/endpoints/primary"
              - "--lakebase-database=databricks_postgres"

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true

      max_concurrent_runs: 1
