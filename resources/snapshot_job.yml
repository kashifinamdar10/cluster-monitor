# Two-task scrape job for Private Link / IP-ACL hubs:
#
#   scrape  — classic single-node job cluster (VNet egress → other workspace APIs)
#             writes staging JSON to a UC Volume
#   sync    — serverless Python (reaches Lakebase) reads staging → Lakebase
#
# Both tasks must share SNAPSHOT_STAGING_PATH. App should use the same path so
# Settings saves can seed <staging>/app_settings.json for the classic scrape.
resources:
  jobs:
    cluster_monitor_snapshot:
      name: cluster-monitor-snapshot
      description: >
        Classic scrape (multi-workspace REST/SDK) → Volume staging → serverless
        Lakebase sync for the read-only App UI.

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      job_clusters:
        - job_cluster_key: scrape_classic
          new_cluster:
            cluster_name: ""
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            data_security_mode: SINGLE_USER

      environments:
        - environment_key: sync_env
          spec:
            client: "2"
            dependencies:
              - psycopg[binary]>=3.0
              - databricks-sdk>=0.81.0
              - cryptography>=42.0.0

      tasks:
        - task_key: scrape
          job_cluster_key: scrape_classic
          spark_python_task:
            python_file: ../snapshot_scrape.py
            parameters:
              # UC Volume both tasks (and ideally the App) can read/write
              - "--staging-path=/Volumes/main/cluster_monitor/staging"
          libraries:
            - pypi:
                package: databricks-sdk>=0.81.0
            - pypi:
                package: cryptography>=42.0.0

        - task_key: sync
          depends_on:
            - task_key: scrape
          environment_key: sync_env
          spark_python_task:
            python_file: ../snapshot_sync.py
            parameters:
              - "--staging-path=/Volumes/main/cluster_monitor/staging"
              - "--lakebase-endpoint=projects/cmon-${bundle.target}/branches/production/endpoints/primary"
              - "--lakebase-database=databricks_postgres"
              - "--lakebase-schema=cluster_monitor_v2"

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true

      max_concurrent_runs: 1
