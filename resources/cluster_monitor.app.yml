# Cluster Monitor — FastAPI + React app (Lakebase-read-only UI).
#
# The classic scrape job writes snapshots; this App only reads Lakebase.
# Job resource grant lets Refresh trigger a new scrape via Jobs API.
resources:
  apps:
    cluster_monitor:
      name: cluster-monitor
      description: >
        Read-only compute monitor UI. Classic job scrapes workspaces into
        Lakebase; App serves snapshots (avoids Apps Private Link cert failures).
      source_code_path: ..

      resources:
        - name: postgres
          postgres:
            branch:     "projects/cmon-${bundle.target}/branches/production"
            database:   "${var.lakebase_database}"
            permission: CAN_CONNECT_AND_CREATE
        - name: scrape-job
          job:
            id: ${resources.jobs.cluster_monitor_snapshot.id}
            permission: CAN_MANAGE_RUN
